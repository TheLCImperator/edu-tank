
<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta charset="UTF-8">

<title>Laser Tag</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #111820;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
    cursor: crosshair;
}

#spawnButton {
    position: fixed;
    top: 20px;
    left: 20px;
    padding: 12px 20px;
    background: #2585e8;
    color: white;
    border: 1px solid #75baff;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    z-index: 10;
}

#spawnButton:hover {
    background: #389cff;
}

#instructions {
    position: fixed;
    bottom: 20px;
    left: 20px;
    color: #aab8c5;
    font-size: 13px;
    line-height: 1.7;
    pointer-events: none;
}

#minimap {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 190px;
    height: 190px;
    background: rgba(10, 20, 30, 0.9);
    border: 2px solid #536a80;
    border-radius: 8px;
    z-index: 10;
}

#ultimateStatus {
    position: fixed;
    bottom: 20px;
    right: 20px;
    padding: 12px 18px;
    background: rgba(10, 25, 40, 0.9);
    color: #55faff;
    border: 1px solid #00aaff;
    border-radius: 8px;
    font-size: 14px;
    font-weight: bold;
    z-index: 10;
}

#spawnEnemy {
    position: fixed; top: 72px; left: 20px; padding: 12px 20px;
    background: #d9364e; color: white; border: 1px solid #ff8997;
    border-radius: 8px; font-size: 15px; font-weight: bold;
    cursor: pointer; z-index: 10;
}
#spawnEnemy:hover { background: #ee4a62; }
#score {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    color: #dbe8f3; font-size: 16px; font-weight: bold;
    pointer-events: none; z-index: 10;
}
#ultimateStatus { white-space: pre-line; line-height: 1.6; text-align: right; }
#deathMsg {
    display: none; position: fixed; top: 40%; left: 50%;
    transform: translate(-50%, -50%); color: #ff5566; font-size: 34px;
    font-weight: bold; text-shadow: 0 0 12px #000;
    pointer-events: none; z-index: 10;
}

#quiz { position: fixed; top: 226px; right: 20px; width: 260px; padding: 12px;
    background: rgba(10,25,40,.92); border: 2px solid #536a80; border-radius: 8px;
    color: #dbe8f3; z-index: 10; font-size: 14px; }
#quizHead { display: flex; justify-content: space-between; font-weight: bold;
    color: #8ac7ff; margin-bottom: 4px; }
#quizQ { font-size: 22px; font-weight: bold; text-align: center; margin: 8px 0 10px; }
#quizOpts button { display: block; width: 100%; margin-bottom: 6px; padding: 8px;
    background: #1d3a58; color: #fff; border: 1px solid #3d6a99; border-radius: 6px;
    font-size: 15px; cursor: pointer; text-align: left; }
#quizOpts button:hover { background: #2b5a8c; }
#quizOpts.locked { opacity: .35; pointer-events: none; }
#quizTimer { height: 6px; background: #26384a; border-radius: 3px; overflow: hidden; }
#quizTimer div { height: 100%; width: 100%; background: #55faff; }
#quizMsg { min-height: 20px; margin-top: 8px; font-weight: bold; text-align: center; }
#boosts { white-space: pre-line; color: #ffbd45; font-size: 13px; line-height: 1.5; min-height: 18px; }
#quizHint { font-size: 11px; color: #7f93a6; text-align: center; margin-top: 6px; }

#spawnButton, #spawnEnemy { display: none; }
#score { white-space: pre; text-align: center; line-height: 1.5; font-size: 13px; }
#lobby { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(10,16,24,.96); z-index: 50; }
#lobbyBox { width: 280px; display: flex; flex-direction: column; gap: 12px; text-align: center; }
#lobbyBox h1 { color: #55faff; letter-spacing: 4px; font-size: 30px; }
#lobbyBox input { padding: 12px; border-radius: 8px; border: 1px solid #3d6a99;
    background: #14212f; color: #fff; font-size: 15px; }
#lobbyBox button { padding: 12px; border-radius: 8px; border: 1px solid #75baff;
    background: #2585e8; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; }
#lobbyMsg { color: #ffbd45; min-height: 20px; font-size: 14px; }

html, body { touch-action: none; user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
#xp { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); width: min(420px, 44vw);
    height: 20px; background: rgba(10,25,40,.85); border: 2px solid #536a80; border-radius: 10px;
    overflow: hidden; z-index: 10; pointer-events: none; }
#xpFill { height: 100%; width: 0; background: linear-gradient(90deg, #1fa8ff, #55faff); }
#xpText { position: absolute; inset: 0; text-align: center; font-size: 12px; line-height: 20px;
    color: #fff; font-weight: bold; text-shadow: 0 0 4px #000; white-space: nowrap; }
#toast { display: none; position: fixed; top: 90px; left: 50%; transform: translateX(-50%);
    padding: 10px 18px; background: rgba(255,200,60,.95); color: #222; font-weight: bold;
    border-radius: 8px; z-index: 40; pointer-events: none; text-align: center; }
#tankBtn { position: fixed; top: 20px; left: 20px; padding: 12px 18px; background: #6a3fd4; color: #fff;
    border: 1px solid #b79cff; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; z-index: 10; }
#abBtn { display: none; position: fixed; right: 28px; bottom: 150px; width: 86px; height: 86px;
    border-radius: 50%; background: rgba(37,133,232,.7); border: 3px solid #8ac7ff; color: #fff;
    font-weight: bold; font-size: 13px; z-index: 10; touch-action: none; }
#garage { display: none; position: fixed; inset: 0; background: rgba(10,16,24,.97); z-index: 30;
    overflow-y: auto; padding: 16px; touch-action: pan-y; }
#garageHead { color: #55faff; font-size: 20px; font-weight: bold; margin-bottom: 12px;
    display: flex; justify-content: space-between; align-items: center; }
#garageHead button { background: #2b3f55; color: #fff; border: 0; border-radius: 6px; padding: 8px 16px; font-size: 16px; }
#garageGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.card { padding: 10px; background: #14212f; color: #fff; border: 2px solid #3d6a99; border-radius: 8px;
    text-align: left; font-size: 14px; cursor: pointer; }
.card small { color: #9fb4c8; }
.card.locked { opacity: .35; }
.card.sel { background: #1d3a58; }
@media (pointer: coarse) {
    #abBtn { display: block; }
    #instructions, #ultimateStatus, #quizHint { display: none; }
    #minimap { width: 110px; height: 110px; }
    #quiz { top: 140px; right: 8px; width: 200px; padding: 8px; font-size: 12px; }
    #quizQ { font-size: 17px; margin: 4px 0 6px; }
    #quizOpts button { padding: 6px; font-size: 13px; margin-bottom: 4px; }
    #score { font-size: 11px; }
}
#quizQ { font-size: 14px !important; text-align: left !important; white-space: pre-line;
    line-height: 1.35; margin: 6px 0 10px !important; }
#quizOpts button { white-space: normal; font-size: 13px !important; padding: 7px 8px !important; }
</style>
</head>

<body>

<button id="spawnButton">+ Spawn Dummy</button>
<button id="spawnEnemy">+ Spawn Enemy</button>
<canvas id="minimap" width="190" height="190"></canvas>
<div id="score"></div>

<div id="instructions">
    WASD: Move<br>
    Mouse: Aim<br>
    Hold left-click: Laser<br>
    E or right-click: Ability<br>
    T: Tank garage<br>
    1–4: Answer quiz<br>
    (everyone gets the same question; first correct answer wins the boost)
</div>

<div id="ultimateStatus"></div>
<div id="deathMsg"></div>

<div id="quiz">
    <div id="quizHead"><span id="quizLevel"></span><span id="quizPoints"></span></div>
    <div id="quizQ"></div>
    <div id="quizOpts"></div>
    <div id="quizTimer"><div></div></div>
    <div id="quizMsg"></div>
    <div id="boosts"></div>
    <div id="quizHint">Press 1–4 to answer</div>
</div>
<div id="lobby">
    <div id="lobbyBox">
        <h1>LASER TAG</h1>
        <input id="nameIn" maxlength="14" placeholder="Your name" autofocus>
        <input id="roomIn" maxlength="20" placeholder="Room code (optional)">
        <button id="joinBtn">Join game</button>
        <div id="lobbyMsg"></div>
    </div>
</div>
<div id="xp"><div id="xpFill"></div><div id="xpText"></div></div>
<div id="toast"></div>
<button id="tankBtn">TANKS [T]</button>
<button id="abBtn">ABILITY</button>
<div id="garage"><div id="garageHead"><span>Choose your tank</span><button id="garageClose">✕</button></div><div id="garageGrid"></div></div>
<canvas id="game"></canvas>

<script src="config.js"></script>
<script>

// =====================================
// CANVAS, WORLD, CLOCK
// =====================================

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const WORLD = { width: 3000, height: 3000 };

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

// Game clock in ms. It advances by delta time, so the game runs at
// the same speed on 60Hz and 144Hz screens (all speeds are per second).
const G = { t: 0 };

// Glow quality (1 = full). Lowered automatically on slow devices.
let FX = 1;

const camera = { x: 0, y: 0, smoothness: 0.12 };
const mouse = { x: canvas.width / 2 + 100, y: canvas.height / 2 };
const keys = {};
let firing = false;
let scatterHeld = false;

const lasers = [];
const particles = [];
let kills = 0;
let deaths = 0;

let ultimate = null;
let lastUltimate = -Infinity;
const ULTIMATE_DURATION = 2500;
const ULTIMATE_COOLDOWN = 8000;
const ULTIMATE_LENGTH = 1300;
const ULTIMATE_DAMAGE_INTERVAL = 250;
const SCATTER_COOLDOWN = 900;


// =====================================
// LOCAL STATE (the server owns the real game; this is what we draw)
// =====================================

const player = {
    id: 0, name: "", x: WORLD.width / 2, y: WORLD.height / 2, size: 42, angle: 0,
    speed: 240, hp: 100, max: 100, dead: true, respawnAt: 0, invuln: 0,
    lastHit: -9999, lastScatter: -1e9, tk: 0, lv: 1, la: -1e9
};
let TANKS = [{ n: "", c: "#2585e8", a: "#8ac7ff", sh: "sq", bar: 1, sz: 42, hp: 100, sp: 240, lv: 1, ab: { n: "", cd: 1 } }];
let tanks = [player];
const others = new Map();


// =====================================
// INPUT
// =====================================

window.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT") return;   // typing in the lobby form
    const k = e.key.toLowerCase();
    keys[k] = true;
    if (k === "e" && !e.repeat) activateUltimate();
    if (k === "t" && !e.repeat) toggleGarage();
    if (k.length === 1 && "1234".includes(k) && !e.repeat) answerQuiz(+k - 1);
    if (["w", "a", "s", "d", " "].includes(k)) e.preventDefault();
});
window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
window.addEventListener("blur", () => {
    for (const k in keys) keys[k] = false;
    firing = false;
    scatterHeld = false;
});

canvas.addEventListener("mousemove", e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});
canvas.addEventListener("mousedown", e => {
    if (e.button === 0) firing = true;
    if (e.button === 2) activateUltimate();
});
window.addEventListener("mouseup", e => {
    if (e.button === 0) firing = false;
    if (e.button === 2) scatterHeld = false;
});
canvas.addEventListener("contextmenu", e => e.preventDefault());


// =====================================
// NETWORK
// =====================================

const PAL = {
    cyan:   ["#00aaff", "#55faff", "#00eaff"],
    orange: ["#ff6a00", "#ffc04d", "#ffa200"],
    red:    ["#d01838", "#ff7a8a", "#ff3050"]
};

const mixWhite = h => {
    const n = parseInt(h.slice(1), 16);
    return "rgb(" + [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.round(v + (255 - v) * 0.55)) + ")";
};

function createParticles(x, y, amount, color = "#55faff") {
    for (let i = 0; i < amount; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = (2 + Math.random() * 5) * 60;
        particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
                         life: 1, size: 2 + Math.random() * 4, color });
    }
}

let ws = null, joined = false, serverOff = null, moving = false;
let ults = [], board = "", meInfo = null;
const quiz = { q: null, deadline: 0, lock: 0, pts: 0, boosts: [], msg: "", color: "#fff", until: 0 };

function connect(name, room) {
    $("lobbyMsg").textContent = "Connecting...";
    const target = (window.GAME_SERVER || "").trim().replace(/^http/, "ws").replace(/\/$/, "");
    ws = new WebSocket(target || ((location.protocol === "https:" ? "wss://" : "ws://") + location.host));
    ws.onopen = () => ws.send(JSON.stringify({ t: "join", name, room }));
    ws.onmessage = e => handle(JSON.parse(e.data));
    ws.onclose = () => {
        const was = joined;
        joined = false;
        $("lobby").style.display = "flex";
        $("lobbyMsg").textContent = was ? "Disconnected. Reload the page to rejoin."
            : "Could not reach the game server. Check GAME_SERVER in config.js.";
    };
}

function handle(m) {
    if (m.t === "welcome") { player.id = m.id; TANKS = m.tanks; joined = true; $("lobby").style.display = "none"; buildGarage(); }
    else if (m.t === "toast") toast(m.text);
    else if (m.t === "full") $("lobbyMsg").textContent = "That room is full. Try another code.";
    else if (m.t === "q") showQuestion(m);
    else if (m.t === "lock") quiz.lock = m.until;
    else if (m.t === "msg") quizMessage(m.text, m.color);
    else if (m.t === "snap") applySnapshot(m);
}

function applySnapshot(m) {
    // Keep our clock in step with the server's clock
    const off = m.st - performance.now();
    serverOff = serverOff === null ? off : serverOff + (off - serverOff) * 0.1;

    const seen = new Set();
    for (const s of m.p) {
        seen.add(s.id);
        if (s.id === player.id) {
            const wasDead = player.dead;
            if (s.hp < player.hp) player.lastHit = G.t;
            Object.assign(player, { name: s.n, hp: s.hp, dead: !!s.d, invuln: s.inv, tk: s.tk, lv: s.lv,
                                    size: TANKS[s.tk].sz, max: TANKS[s.tk].hp });
            const err = Math.hypot(s.x - player.x, s.y - player.y);
            if ((wasDead && !player.dead) || err > 120) { player.x = s.x; player.y = s.y; }
            else if (!moving && err > 3) {            // we predict our own movement,
                player.x += (s.x - player.x) * 0.2;   // so only correct while standing still
                player.y += (s.y - player.y) * 0.2;
            }
            continue;
        }
        let t = others.get(s.id);
        if (!t) {
            t = { id: s.id, size: 42, max: 100, x: s.x, y: s.y };
            others.set(s.id, t);
        }
        Object.assign(t, { name: s.n, tx: s.x, ty: s.y, angle: s.a, hp: s.hp,
                           dead: !!s.d, invuln: s.inv, tk: s.tk, lv: s.lv,
                           size: TANKS[s.tk].sz, max: TANKS[s.tk].hp });
    }
    for (const id of [...others.keys()]) if (!seen.has(id)) others.delete(id);
    tanks = [...others.values(), player];

    const me = m.me;
    player.speed = me.sp;
    player.respawnAt = me.ra;
    player.la = me.la;
    meInfo = me;
    kills = me.k;
    deaths = me.dt;
    quiz.pts = me.pts;
    quiz.boosts = me.b;

    for (const l of m.l) {
        lasers.push({ x: l[0], y: l[1], angle: l[2], len: l[3], born: G.t,
                      color: l[4] });
    }
    for (const h of m.h) createParticles(h[0], h[1], h[3], h[2]);
    ults = m.u.map(u => ({ id: u.id, x: u.x, y: u.y, angle: u.a, start: u.s }));
    board = "KILLS\n" + m.p.slice().sort((a, b) => b.k - a.k).slice(0, 5)
        .map(s => s.n + ": " + s.k).join("\n");
}

function sendInput() {
    if (!joined || ws.readyState !== 1) return;
    const { dx, dy } = moveVec();
    moving = !!(dx || dy);

    const msg = JSON.stringify({ t: "in", dx: +dx.toFixed(2), dy: +dy.toFixed(2), a: +player.angle.toFixed(3),
                                 f: firing || touch.fire, s: false });
    const t = performance.now();
    if ((msg !== sendInput.last && t - sendInput.at >= 33) || t - sendInput.at > 100) {
        ws.send(msg);
        sendInput.last = msg;
        sendInput.at = t;
    }
}
sendInput.at = 0;

function activateUltimate() {
    if (joined && ws.readyState === 1) ws.send(JSON.stringify({ t: "ult" }));
}


// =====================================
// QUIZ PANEL (questions come from the server)
// =====================================

function showQuestion(m) {
    quiz.q = m;
    quiz.deadline = m.deadline;
    quiz.lock = 0;
    $("quizQ").textContent = m.s + "\n" + m.text;

    const box = $("quizOpts");
    box.innerHTML = "";
    m.options.forEach((o, i) => {
        const b = document.createElement("button");
        b.textContent = (i + 1) + ".  " + o;
        b.onmousedown = e => e.preventDefault();
        b.onclick = () => answerQuiz(i);
        box.appendChild(b);
    });
}

function answerQuiz(i) {
    if (!joined || !quiz.q || G.t < quiz.lock || ws.readyState !== 1) return;
    ws.send(JSON.stringify({ t: "ans", i }));
}

function quizMessage(text, color) {
    quiz.msg = text;
    quiz.color = color;
    quiz.until = G.t + 2500;
}

function updateQuiz() {
    const lvl = Math.min(5, 1 + Math.floor(quiz.pts / 50));
    $("quizLevel").textContent = "Level " + lvl + (lvl === 5 ? " (max)" : "");
    $("quizPoints").textContent = quiz.pts + " pts";
    $("quizTimer").firstElementChild.style.width =
        Math.max(0, (quiz.deadline - G.t) / 25000 * 100) + "%";
    $("quizOpts").classList.toggle("locked", G.t < quiz.lock);
    $("quizMsg").textContent = G.t < quiz.until ? quiz.msg : "";
    $("quizMsg").style.color = quiz.color;
    $("boosts").textContent = quiz.boosts
        .map(b => b[0] + " " + Math.max(0, (b[1] - G.t) / 1000).toFixed(1) + "s").join("\n");
}


// =====================================
// UPDATE (prediction and smoothing only; no game rules here)
// =====================================

function updateCamera(dt) {
    const k = 1 - Math.pow(1 - camera.smoothness, dt * 60);
    camera.x += (player.x - canvas.width / 2 - camera.x) * k;
    camera.y += (player.y - canvas.height / 2 - camera.y) * k;
    camera.x = Math.max(0, Math.min(Math.max(0, WORLD.width - canvas.width), camera.x));
    camera.y = Math.max(0, Math.min(Math.max(0, WORLD.height - canvas.height), camera.y));
}

function updateEffects(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= 3.3 * dt;
        if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = lasers.length - 1; i >= 0; i--) {
        if (G.t - lasers[i].born > 180) lasers.splice(i, 1);
    }
}

function update(dt) {
    G.t = performance.now() + (serverOff || 0);

    if (!player.dead) {
        player.angle = touch.aim ? touch.aim.a : Math.atan2(mouse.y + camera.y - player.y, mouse.x + camera.x - player.x);
        const { dx, dy } = moveVec(), l = Math.hypot(dx, dy), k = l > 1 ? 1 / l : 1;
        player.x = Math.max(25, Math.min(WORLD.width - 25, player.x + dx * k * player.speed * dt));
        player.y = Math.max(25, Math.min(WORLD.height - 25, player.y + dy * k * player.speed * dt));
    }

    for (const t of others.values()) {          // glide other tanks toward their latest position
        const k = Math.min(1, dt * 12);
        t.x += (t.tx - t.x) * k;
        t.y += (t.ty - t.y) * k;
    }
    updateCamera(dt);
    updateEffects(dt);
    updateQuiz();
}


// =====================================
// ULTIMATE VISUAL
// =====================================

function drawUltimate(now) {
    if (!ultimate) return;

    const elapsed = now - ultimate.start;

    const dx = Math.cos(ultimate.angle);
    const dy = Math.sin(ultimate.angle);
    const px = -dy;
    const py = dx;

    const muzzleX = ultimate.x;
    const muzzleY = ultimate.y;

    ctx.save();
    ctx.lineCap = "round";

    // PHASE 1: PARTICLES SPIRAL INWARDS (0–650ms)
    if (elapsed < 650) {
        const progress = elapsed / 650;

        for (let i = 0; i < 100; i++) {
            const seed = i * 2.399;
            const direction = i % 2 === 0 ? 1 : -1;
            const angle = seed + now * 0.009 * direction;

            // Particles begin in a wide cloud and converge on the barrel
            const radius = (35 + (i % 7) * 15) * (1 - progress);

            const x = muzzleX + Math.cos(angle) * radius;
            const y = muzzleY + Math.sin(angle) * radius;

            const particleSize = 1.8 + progress * 2.8;

            ctx.fillStyle = i % 5 === 0 ? "#ffffff" : "#55faff";
            ctx.shadowColor = "#00eaff";
            ctx.shadowBlur = 16 * FX;

            ctx.beginPath();
            ctx.arc(x, y, particleSize, 0, Math.PI * 2);
            ctx.fill();

            // Short trails make the inward movement easier to see
            ctx.strokeStyle = "rgba(80, 245, 255, 0.65)";
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(
                muzzleX + Math.cos(angle) * (radius + 9),
                muzzleY + Math.sin(angle) * (radius + 9)
            );
            ctx.lineTo(x, y);
            ctx.stroke();
        }

        const glowRadius = 12 + progress * 28;
        const glow = ctx.createRadialGradient(
            muzzleX, muzzleY, 1,
            muzzleX, muzzleY, glowRadius
        );
        glow.addColorStop(0, "rgba(255,255,255,0.95)");
        glow.addColorStop(0.35, "rgba(0,235,255,0.75)");
        glow.addColorStop(1, "rgba(0,180,255,0)");

        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(muzzleX, muzzleY, glowRadius, 0, Math.PI * 2);
        ctx.fill();
    }

    // PHASE 2: ENERGY ORB CHARGES (650–950ms)
    else if (elapsed < 950) {
        const progress = (elapsed - 650) / 300;
        const pulse = 1 + Math.sin(now * 0.035) * 0.12;
        const radius = (13 + progress * 25) * pulse;

        // Bright central sphere
        const orb = ctx.createRadialGradient(
            muzzleX - radius * 0.2,
            muzzleY - radius * 0.2,
            1,
            muzzleX,
            muzzleY,
            radius * 1.8
        );

        orb.addColorStop(0, "#ffffff");
        orb.addColorStop(0.25, "#dfffff");
        orb.addColorStop(0.55, "#28eaff");
        orb.addColorStop(1, "rgba(0,130,255,0)");

        ctx.fillStyle = orb;
        ctx.shadowColor = "#00eaff";
        ctx.shadowBlur = 45 * FX;

        ctx.beginPath();
        ctx.arc(muzzleX, muzzleY, radius * 1.8, 0, Math.PI * 2);
        ctx.fill();

        // Three rotating energy rings
        for (let i = 0; i < 3; i++) {
            ctx.save();
            ctx.translate(muzzleX, muzzleY);
            ctx.rotate(now * 0.006 * (i % 2 === 0 ? 1 : -1) * (i + 1));

            ctx.strokeStyle = i === 1 ? "#ffffff" : "#75faff";
            ctx.lineWidth = 2.5;
            ctx.shadowColor = "#00eaff";
            ctx.shadowBlur = 18 * FX;

            ctx.beginPath();
            ctx.ellipse(
                0, 0,
                radius * (1.25 + i * 0.2),
                radius * (0.42 + i * 0.06),
                0, 0, Math.PI * 2
            );
            ctx.stroke();
            ctx.restore();
        }

        // Tiny sparks orbiting the sphere
        for (let i = 0; i < 24; i++) {
            const angle = now * 0.012 + i * Math.PI * 2 / 24;
            const orbit = radius * (1.5 + (i % 3) * 0.25);

            ctx.fillStyle = "#ffffff";
            ctx.shadowBlur = 14 * FX;
            ctx.beginPath();
            ctx.arc(
                muzzleX + Math.cos(angle) * orbit,
                muzzleY + Math.sin(angle) * orbit,
                2.2,
                0,
                Math.PI * 2
            );
            ctx.fill();
        }
    }

    // PHASE 3: EXPLOSION AND SHOCKWAVE (950–1150ms)
    else if (elapsed < 1150) {
        const progress = (elapsed - 950) / 200;
        const radius = 18 + progress * 125;
        const opacity = 1 - progress;

        // Expanding shockwave
        ctx.globalAlpha = opacity;
        ctx.strokeStyle = "#bfffff";
        ctx.lineWidth = 12 * (1 - progress) + 1;
        ctx.shadowColor = "#00eaff";
        ctx.shadowBlur = 35 * FX;

        ctx.beginPath();
        ctx.arc(muzzleX, muzzleY, radius, 0, Math.PI * 2);
        ctx.stroke();

        // Second, softer shockwave
        ctx.strokeStyle = "#00bfff";
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(muzzleX, muzzleY, radius * 0.72, 0, Math.PI * 2);
        ctx.stroke();

        // Radial energy streaks
        for (let i = 0; i < 48; i++) {
            const angle = i * Math.PI * 2 / 48;
            const inner = radius * 0.2;
            const outer = radius * (0.75 + (i % 4) * 0.07);

            ctx.strokeStyle = i % 3 === 0 ? "#ffffff" : "#75faff";
            ctx.lineWidth = 2 + (1 - progress) * 2;
            ctx.beginPath();
            ctx.moveTo(
                muzzleX + Math.cos(angle) * inner,
                muzzleY + Math.sin(angle) * inner
            );
            ctx.lineTo(
                muzzleX + Math.cos(angle) * outer,
                muzzleY + Math.sin(angle) * outer
            );
            ctx.stroke();
        }

        // White flash at the centre, fading quickly
        const flash = ctx.createRadialGradient(
            muzzleX, muzzleY, 1,
            muzzleX, muzzleY, 65 * (1 - progress) + 1
        );
        flash.addColorStop(0, `rgba(255,255,255,${opacity})`);
        flash.addColorStop(0.35, `rgba(80,245,255,${opacity * 0.8})`);
        flash.addColorStop(1, "rgba(0,180,255,0)");

        ctx.fillStyle = flash;
        ctx.beginPath();
        ctx.arc(muzzleX, muzzleY, 70, 0, Math.PI * 2);
        ctx.fill();

        ctx.globalAlpha = 1;
    }

    // PHASE 4: DEATH STAR BEAM (1150–2500ms)
    else {
        const beamElapsed = elapsed - 1150;
        const beamLength = ULTIMATE_LENGTH;
        const beamPulse = 1 + Math.sin(now * 0.025) * 0.08;

        const endX = muzzleX + dx * beamLength;
        const endY = muzzleY + dy * beamLength;

        // Layered beam glow
        const layers = [
            { width: 78, color: "rgba(0, 90, 255, 0.20)" },
            { width: 52, color: "rgba(0, 190, 255, 0.35)" },
            { width: 30, color: "rgba(0, 235, 255, 0.75)" },
            { width: 14, color: "#bfffff" },
            { width: 5, color: "#ffffff" }
        ];

        for (const layer of layers) {
            ctx.beginPath();
            ctx.moveTo(muzzleX, muzzleY);
            ctx.lineTo(endX, endY);

            ctx.strokeStyle = layer.color;
            ctx.lineWidth = layer.width * beamPulse;
            ctx.shadowColor = "#00eaff";
            ctx.shadowBlur = 38 * FX;
            ctx.stroke();
        }

        // Small energy elements racing forward inside the beam
        for (let i = 0; i < 115; i++) {
            const speed = 0.00065 + (i % 7) * 0.00011;
            const phase = (beamElapsed * speed + i * 0.137) % 1;
            const distance = phase * beamLength;

            // Particles converge towards the centre as they travel
            const spread = (1 - phase) * 27 + 2;
            const sideOffset =
                Math.sin(beamElapsed * 0.012 + i * 2.4) * spread;

            const x = muzzleX + dx * distance + px * sideOffset;
            const y = muzzleY + dy * distance + py * sideOffset;

            const size = 2 + (i % 4) * 0.65;

            ctx.fillStyle = i % 4 === 0 ? "#ffffff" : "#72ffff";
            ctx.shadowColor = "#00eaff";
            ctx.shadowBlur = 18 * FX;

            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.fill();
        }

        // Fast streaks travelling in the same direction
        for (let i = 0; i < 42; i++) {
            const phase = (beamElapsed * 0.0016 + i * 0.113) % 1;
            const distance = phase * beamLength;

            const x = muzzleX + dx * distance;
            const y = muzzleY + dy * distance;
            const streakLength = 18 + (i % 5) * 7;

            ctx.strokeStyle = i % 4 === 0
                ? "rgba(255,255,255,0.95)"
                : "rgba(150,255,255,0.85)";
            ctx.lineWidth = 2.5;
            ctx.shadowColor = "#00eaff";
            ctx.shadowBlur = 12 * FX;

            ctx.beginPath();
            ctx.moveTo(x - dx * streakLength, y - dy * streakLength);
            ctx.lineTo(x, y);
            ctx.stroke();
        }

        // Bright muzzle core
        const muzzlePulse = 13 + Math.sin(now * 0.04) * 4;

        ctx.fillStyle = "#ffffff";
        ctx.shadowColor = "#00eaff";
        ctx.shadowBlur = 38 * FX;

        ctx.beginPath();
        ctx.arc(muzzleX, muzzleY, muzzlePulse, 0, Math.PI * 2);
        ctx.fill();

        // Bright energy at the beam endpoint
        ctx.fillStyle = "#cfffff";
        ctx.shadowBlur = 42 * FX;

        ctx.beginPath();
        ctx.arc(
            endX,
            endY,
            12 + Math.sin(now * 0.03) * 4,
            0,
            Math.PI * 2
        );
        ctx.fill();
    }

    ctx.restore();
}

// =====================================
// HEALTH BAR
// =====================================

function drawHealthBar(x, y, width, health, maxHealth) {
    const height = 7;
    const percentage = Math.max(0, health / maxHealth);

    ctx.fillStyle = "#451e27";
    ctx.fillRect(x - width / 2, y, width, height);

    ctx.fillStyle =
        percentage > 0.5 ? "#36e080" :
        percentage > 0.25 ? "#ffbd45" :
        "#ff4545";

    ctx.fillRect(
        x - width / 2,
        y,
        width * percentage,
        height
    );

    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1;
    ctx.strokeRect(x - width / 2, y, width, height);
}


// =====================================
// BACKGROUND GRID
// =====================================

function drawGrid() {
    const sp = 40;

    ctx.fillStyle = "#111820";
    ctx.fillRect(camera.x, camera.y, canvas.width, canvas.height);

    ctx.strokeStyle = "#202c38";
    ctx.lineWidth = 1;
    ctx.beginPath();

    for (let x = Math.floor(camera.x / sp) * sp; x < camera.x + canvas.width + sp; x += sp) {
        ctx.moveTo(x, camera.y);
        ctx.lineTo(x, camera.y + canvas.height);
    }
    for (let y = Math.floor(camera.y / sp) * sp; y < camera.y + canvas.height + sp; y += sp) {
        ctx.moveTo(camera.x, y);
        ctx.lineTo(camera.x + canvas.width, y);
    }
    ctx.stroke();

    ctx.strokeStyle = "#40566b";
    ctx.lineWidth = 8;
    ctx.strokeRect(0, 0, WORLD.width, WORLD.height);
}


// =====================================
// DRAW TANKS (each tank type has its own colour, shape and barrels)
// =====================================

function drawTank(t) {
    if (t.dead) return;
    const d = TANKS[t.tk] || TANKS[0], s = t.size / 2;

    ctx.save();
    if (G.t < t.invuln) ctx.globalAlpha = 0.5 + 0.3 * Math.sin(G.t * 0.02);
    ctx.translate(t.x, t.y);

    ctx.save();
    ctx.rotate(t.angle);
    for (let i = 0; i < d.bar; i++) {
        const off = (i - (d.bar - 1) / 2) * 11;
        ctx.fillStyle = "#9aa8b5";
        ctx.fillRect(4, off - 4, s + 14, 8);
        ctx.fillStyle = d.a;
        ctx.fillRect(s + 8, off - 4, 8, 8);
    }
    ctx.restore();

    ctx.fillStyle = d.c;
    ctx.strokeStyle = d.a;
    ctx.lineWidth = 3;
    ctx.beginPath();
    if (d.sh === "sq") ctx.rect(-s, -s, t.size, t.size);
    else if (d.sh === "circ") ctx.arc(0, 0, s, 0, Math.PI * 2);
    else {
        const n = d.sh === "hex" ? 6 : 3, r = d.sh === "hex" ? s * 1.1 : s * 1.25;
        for (let i = 0; i < n; i++) {
            const a = i * 2 * Math.PI / n - Math.PI / 2;
            ctx[i ? "lineTo" : "moveTo"](Math.cos(a) * r, Math.sin(a) * r);
        }
        ctx.closePath();
    }
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    drawHealthBar(t.x, t.y - s - 14, Math.max(52, t.size), t.hp, t.max);
}


// =====================================
// DRAW LASERS AND PARTICLES
// =====================================

function drawLasers() {
    ctx.lineCap = "round";

    for (const l of lasers) {
        const outer = l.color, mid = mixWhite(l.color), glow = l.color;
        const ex = l.x + Math.cos(l.angle) * l.len;
        const ey = l.y + Math.sin(l.angle) * l.len;

        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - (G.t - l.born) / 180);
        ctx.shadowColor = glow;

        for (const [color, width, blur] of [[outer, 13, 25], [mid, 5, 15], ["#ffffff", 1.5, 8]]) {
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.shadowBlur = blur * FX;
            ctx.beginPath();
            ctx.moveTo(l.x, l.y);
            ctx.lineTo(ex, ey);
            ctx.stroke();
        }
        ctx.restore();
    }
}

function drawParticles() {
    ctx.save();
    ctx.shadowBlur = 12 * FX;

    for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();
}


// =====================================
// MINIMAP AND HUD
// =====================================

const miniCanvas = document.getElementById("minimap");
const miniCtx = miniCanvas.getContext("2d");

function drawMinimap() {
    const w = miniCanvas.width, h = miniCanvas.height, m = miniCtx;
    const sx = w / WORLD.width, sy = h / WORLD.height;

    m.fillStyle = "#182936";
    m.fillRect(0, 0, w, h);

    m.strokeStyle = "#2b4050";
    m.lineWidth = 0.5;
    m.beginPath();
    for (let i = 0; i <= w; i += 19) {
        m.moveTo(i, 0); m.lineTo(i, h);
        m.moveTo(0, i); m.lineTo(w, i);
    }
    m.stroke();

    for (const t of tanks) {
        if (t.dead && !t.dummy) continue;
        m.fillStyle = t === player ? "#39a5ff" : t.dead ? "#71343d" : "#ff4058";
        m.beginPath();
        m.arc(t.x * sx, t.y * sy, t === player ? 4 : 3, 0, Math.PI * 2);
        m.fill();
    }

    m.strokeStyle = "#ffffff";
    m.lineWidth = 1.5;
    m.strokeRect(camera.x * sx, camera.y * sy, canvas.width * sx, canvas.height * sy);
    m.strokeStyle = "#8096a8";
    m.lineWidth = 2;
    m.strokeRect(0, 0, w, h);
}

const $ = id => document.getElementById(id);

function updateHUD() {
    const d = TANKS[player.tk] || TANKS[0], mi = meInfo;
    const rem = d.ab.cd - (G.t - player.la);
    $("ultimateStatus").textContent = d.ab.n + (rem > 0 ? ": " + (rem / 1000).toFixed(1) + "s" : " READY [E / RMB]");
    $("abBtn").textContent = rem > 0 ? (rem / 1000).toFixed(1) : d.ab.n;
    $("abBtn").style.opacity = rem > 0 ? 0.45 : 1;

    if (mi) {
        $("xpFill").style.width = Math.min(100, mi.xp / mi.need * 100) + "%";
        $("xpText").textContent = "LV " + mi.lv + "  ·  " + d.n + "  ·  " + mi.xp + " / " + mi.need + " XP";
    }

    const dm = $("deathMsg");
    dm.style.display = player.dead ? "block" : "none";
    if (player.dead) dm.textContent = "YOU DIED — respawning in " + Math.max(0, Math.ceil((player.respawnAt - G.t) / 1000));
}


// =====================================
// TOUCH CONTROLS, TOAST AND TANK GARAGE
// =====================================

const isTouch = "ontouchstart" in window || (navigator.maxTouchPoints || 0) > 0;
const touch = { move: null, aim: null, fire: false };

function moveVec() {
    if (touch.move) return { dx: touch.move.dx, dy: touch.move.dy };
    return { dx: (keys.d ? 1 : 0) - (keys.a ? 1 : 0), dy: (keys.s ? 1 : 0) - (keys.w ? 1 : 0) };
}

// Left half of the screen = move stick, right half = aim stick (auto-fires while aiming)
canvas.addEventListener("touchstart", e => {
    e.preventDefault();
    for (const c of e.changedTouches) {
        const st = { id: c.identifier, ox: c.clientX, oy: c.clientY, x: c.clientX, y: c.clientY, dx: 0, dy: 0, a: player.angle };
        if (c.clientX < innerWidth / 2) { if (!touch.move) touch.move = st; }
        else if (!touch.aim) touch.aim = st;
    }
}, { passive: false });

canvas.addEventListener("touchmove", e => {
    e.preventDefault();
    for (const c of e.changedTouches) {
        const st = touch.move && touch.move.id === c.identifier ? touch.move :
                   touch.aim && touch.aim.id === c.identifier ? touch.aim : null;
        if (!st) continue;
        st.x = c.clientX; st.y = c.clientY;
        const vx = st.x - st.ox, vy = st.y - st.oy, len = Math.hypot(vx, vy);
        if (st === touch.move) {
            const k = Math.min(1, len / 60);
            st.dx = len ? vx / len * k : 0;
            st.dy = len ? vy / len * k : 0;
        } else if (len > 12) { st.a = Math.atan2(vy, vx); touch.fire = true; }
        else touch.fire = false;
    }
}, { passive: false });

function endTouch(e) {
    for (const c of e.changedTouches) {
        if (touch.move && touch.move.id === c.identifier) touch.move = null;
        if (touch.aim && touch.aim.id === c.identifier) { touch.aim = null; touch.fire = false; }
    }
}
canvas.addEventListener("touchend", endTouch);
canvas.addEventListener("touchcancel", endTouch);

function drawTouch() {
    for (const st of [touch.move, touch.aim]) {
        if (!st) continue;
        const vx = st.x - st.ox, vy = st.y - st.oy, len = Math.hypot(vx, vy) || 1, m = Math.min(len, 60);
        ctx.strokeStyle = "rgba(255,255,255,0.35)";
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(st.ox, st.oy, 60, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = "rgba(255,255,255,0.3)";
        ctx.beginPath(); ctx.arc(st.ox + vx / len * m, st.oy + vy / len * m, 26, 0, Math.PI * 2); ctx.fill();
    }
}

function toast(text) {
    const t = $("toast");
    t.textContent = text;
    t.style.display = "block";
    clearTimeout(toast.h);
    toast.h = setTimeout(() => { t.style.display = "none"; }, 3500);
}

function toggleGarage() {
    const g = $("garage");
    g.style.display = g.style.display === "block" ? "none" : "block";
    if (g.style.display === "block") buildGarage();
}

function buildGarage() {
    const box = $("garageGrid"), lv = meInfo ? meInfo.lv : 1;
    box.innerHTML = "";
    TANKS.forEach((d, i) => {
        const ok = d.lv <= lv, b = document.createElement("button");
        b.className = "card" + (ok ? "" : " locked") + (i === player.tk ? " sel" : "");
        b.style.borderColor = d.c;
        b.innerHTML = "<b>" + d.n + "</b><br><small>" + d.hp + " HP · " + d.dm + " dmg<br>" +
            (ok ? "Ability: " + d.ab.n : "Unlocks at level " + d.lv) + "</small>";
        b.onclick = () => {
            if (!ok || !joined) return;
            ws.send(JSON.stringify({ t: "tank", i }));
            $("garage").style.display = "none";
        };
        box.appendChild(b);
    });
}


// =====================================
// DRAW (everything on screen, no game logic)
// =====================================

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-camera.x, -camera.y);
    drawGrid();

    for (const u of ults) {                      // every player's ultimate uses the same visuals
        if (u.id === player.id) {
            if (G.t - u.start < 950) u.angle = player.angle;
            u.x = player.x + Math.cos(u.angle) * 38;
            u.y = player.y + Math.sin(u.angle) * 38;
        }
        ultimate = u;
        drawUltimate(G.t);
    }
    ultimate = ults.find(u => u.id === player.id) || null;   // used by the HUD

    drawLasers();
    drawParticles();
    for (const t of tanks) {
        drawTank(t);
        if (!t.dead) {
            ctx.fillStyle = "#dbe8f3";
            ctx.font = "12px Arial";
            ctx.textAlign = "center";
            ctx.fillText("Lv" + (t.lv || 1) + " " + (t.name || ""), t.x, t.y - t.size / 2 - 28);
        }
    }
    ctx.restore();

    if (!player.dead && G.t - player.lastHit < 150) {
        ctx.fillStyle = "rgba(255, 0, 0, 0.15)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    drawMinimap();
    drawTouch();
    updateHUD();
    $("score").textContent = board;
}


// =====================================
// MAIN LOOP
// =====================================

let lastFrame = performance.now();
let slowFrames = 0;

function gameLoop(now) {
    const raw = (now - lastFrame) / 1000;
    lastFrame = now;
    const dt = Math.max(0, Math.min(0.05, raw));

    update(dt);
    sendInput();
    draw();

    slowFrames = raw > 0.028 ? slowFrames + 1 : Math.max(0, slowFrames - 1);
    if (slowFrames > 60) FX = 0.3;

    requestAnimationFrame(gameLoop);
}


// =====================================
// LOBBY AND START
// =====================================

function join() {
    if (ws) return;
    if (location.protocol === "file:" && !window.GAME_SERVER) {
        $("lobbyMsg").textContent = "Start the server (node server.js), then open http://localhost:3002";
        return;
    }
    connect($("nameIn").value.trim() || "Player", $("roomIn").value.trim() || "lobby");
}
$("joinBtn").onclick = join;
$("tankBtn").onclick = toggleGarage;
$("garageClose").onclick = toggleGarage;
$("abBtn").ontouchstart = e => { e.preventDefault(); activateUltimate(); };
$("abBtn").onclick = activateUltimate;
$("nameIn").onkeydown = $("roomIn").onkeydown = e => { if (e.key === "Enter") join(); };
$("roomIn").value = new URLSearchParams(location.search).get("room") || "";

updateCamera(1);
requestAnimationFrame(gameLoop);

</script>
